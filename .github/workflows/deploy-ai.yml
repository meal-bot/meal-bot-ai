name: AI Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths-ignore:
      - '.github/**'
      - '**.md'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} bash << 'REMOTE'
            set -euo pipefail
            cd ~/meal-bot/ai
            echo "=== [1/5] Pull latest code ==="
            git fetch origin develop
            git reset --hard origin/develop
            git log --oneline -1
            echo "=== [2/5] Build image ==="
            docker compose -f compose.prod.yml build
            echo "=== [3/5] Stop old container ==="
            docker compose -f compose.prod.yml down
            echo "=== [4/5] Start new container ==="
            docker compose -f compose.prod.yml up -d
            echo "=== [5/5] Wait for healthy ==="
            for i in {1..30}; do
              status=$(docker inspect --format='{{.State.Health.Status}}' meal-bot-ai 2>/dev/null || echo "starting")
              echo "  attempt $i/30: $status"
              if [ "$status" = "healthy" ]; then
                echo "=== Deploy SUCCESS ==="
                exit 0
              fi
              sleep 3
            done
            echo "=== Deploy FAILED (healthcheck timeout) ==="
            docker logs --tail 30 meal-bot-ai
            exit 1
          REMOTE
