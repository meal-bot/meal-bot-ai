name: AI Deploy (Dry Run)

on:
  workflow_dispatch:

jobs:
  verify-connection:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          head -1 ~/.ssh/deploy_key && tail -1 ~/.ssh/deploy_key && wc -l ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Verify SSH connection
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "echo '=== Connection OK ===' && hostname && date && echo '--- repo status ---' && cd ~/meal-bot/ai && git log --oneline -3 && echo '--- container status ---' && docker ps --filter name=meal-bot-ai"
