services:
  ai:
    build:
      context: .
      dockerfile: docker/ai/Dockerfile
    image: meal-bot-ai:latest
    container_name: meal-bot-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - rag-api/.env
    environment:
      RECIPE_JSON_PATH: /app/data/recipes_enriched_v2.json
    volumes:
      - ./rag-api/chroma:/app/chroma
      - ./rag-api/bm25:/app/bm25
      - hf_cache:/app/.cache/huggingface
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 8G
        reservations:
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  hf_cache:
